# Cloud Build config for AJN Radio (simple): one small container that fetches your AJN feeds and the
# Daily News Digest and serves them to the web player. No database, no secrets, no Cloud SQL.
#   A) zip upload      -> app is at the source root, _APP_DIR stays "."
#   B) GitHub trigger  -> --config radio-platform/cloudbuild.yaml with _APP_DIR=radio-platform
# UNVERIFIED on Google Cloud: written from the Cloud Build / Cloud Run docs, never run there.
substitutions:
  _REGION: us-central1
  _AR_REPO: ajn-radio            # Artifact Registry Docker repository (must already exist)
  _SERVICE: ajn-radio            # Cloud Run service name
  _APP_DIR: "."
  _AUTH_FLAG: --allow-unauthenticated
  _MAX_INSTANCES: "2"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: ${_APP_DIR}
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ajn-radio:$BUILD_ID", "-f", "Dockerfile", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ajn-radio:$BUILD_ID"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ajn-radio:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - ${_AUTH_FLAG}
      - --port=8080
      - --memory=512Mi
      - --max-instances=${_MAX_INSTANCES}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ajn-radio:$BUILD_ID
